name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package release archive and prepare source.json
        id: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ARCHIVE="rules_csharp-${TAG}.tar.gz"

          # 1. Create release archive
          git archive --format=tar.gz --prefix="rules_csharp-${VERSION}/" "${TAG}" > "${ARCHIVE}"

          # 2. Stamp version into MODULE.bazel
          sed -i.bak -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" MODULE.bazel
          rm -f MODULE.bazel.bak

          # 3. Compute archive SRI hash
          INTEGRITY="sha256-$(openssl dgst -sha256 -binary "${ARCHIVE}" | base64 | tr -d '\n')"

          # 4. Populate source.json from template
          sed -e "s|{OWNER}|${GITHUB_REPOSITORY_OWNER}|g" \
              -e "s|{REPO}|rules_csharp|g" \
              -e "s|{TAG}|${TAG}|g" \
              -e "s|{VERSION}|${VERSION}|g" \
              -e "s|\"\\*\\*leave this alone\\*\\*\"|\"${INTEGRITY}\"|g" \
              .bcr/source.template.json > source.json

          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: rules_csharp-${{ github.ref_name }}.tar.gz

      - name: Attest MODULE.bazel provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: MODULE.bazel

      - name: Attest source.json provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: source.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "rules_csharp-${GITHUB_REF_NAME}.tar.gz" \
            MODULE.bazel \
            source.json \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish_to_bcr:
    name: Publish to Bazel Central Registry
    needs: [release]
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v0.2.2
    with:
      tag_name: ${{ github.ref_name }}
      registry_fork: rulescsharp/bazel-central-registry
      attest: true
      draft: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
